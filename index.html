<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学校の校務PCで、インストール不要で使えるソフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F7EE;
    --sidebar-bg:#E7F0DF;
    --card-bg:#FFFFFF;
    --line:#CFE0C2;
    --accent:#5B8C56;
    --accent-deep:#2F4B2C;
    --accent-soft:#A9CB9B;
    --text:#28331F;
    --text-muted:#6E7C63;
    --shadow: 0 8px 24px rgba(47,75,44,0.08);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP", sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- Layout ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--line);
    padding:32px 0 32px 28px;
    position:relative;
  }
  .sidebar-header{
    font-family:"Zen Maru Gothic", sans-serif;
    font-weight:900;
    font-size:1.15rem;
    color:var(--accent-deep);
    margin:0 0 4px 0;
    letter-spacing:.02em;
  }
  .sidebar-sub{
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    color:var(--text-muted);
    margin:0 0 28px 0;
  }

  .vine{
    position:relative;
    padding-left:26px;
  }
  .vine::before{
    content:"";
    position:absolute;
    left:5px;
    top:6px;
    bottom:6px;
    width:2px;
    background:linear-gradient(to bottom, var(--accent-soft), var(--line) 90%);
    border-radius:2px;
  }

  .soft-item{
    position:relative;
    list-style:none;
    margin:0 0 6px 0;
  }
  .soft-item::before{
    /* leaf node */
    content:"";
    position:absolute;
    left:-26px;
    top:14px;
    width:12px;
    height:12px;
    background:var(--card-bg);
    border:2px solid var(--accent-soft);
    border-radius:60% 60% 60% 0% / 60% 60% 40% 40%;
    transform:rotate(45deg);
    transition:all .25s ease;
  }
  .soft-item button{
    all:unset;
    display:block;
    width:100%;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:"Noto Sans JP", sans-serif;
    font-size:.92rem;
    color:var(--text);
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .soft-item button:hover{
    background:rgba(91,140,86,0.1);
    transform:translateX(2px);
  }
  .soft-item button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .soft-item.active::before{
    background:var(--accent);
    border-color:var(--accent-deep);
    box-shadow:0 0 0 4px rgba(91,140,86,0.18);
  }
  .soft-item.active button{
    background:var(--accent-soft);
    color:var(--accent-deep);
    font-weight:700;
  }
  .soft-item .tag{
    display:block;
    font-family:"JetBrains Mono", monospace;
    font-size:.66rem;
    color:var(--text-muted);
    margin-top:1px;
  }
  .soft-item.active .tag{ color:var(--accent-deep); opacity:.75; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding:48px 56px;
    display:flex;
    justify-content:center;
  }
  .card{
    width:100%;
    max-width:680px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:rise .35s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .thumb{
    width:100%;
    aspect-ratio:16/9;
    background:
      repeating-linear-gradient(135deg,
        rgba(91,140,86,0.06) 0px, rgba(91,140,86,0.06) 10px,
        transparent 10px, transparent 20px),
      var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:16px;
  }
  .thumb img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:6px;
    box-shadow:0 4px 14px rgba(47,75,44,0.15);
  }
  .thumb .fallback-icon{
    font-size:3rem;
  }
  .card-body{ padding:28px 32px 32px; }
  .eyebrow{
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 8px 0;
  }
  h1.title{
    font-family:"Zen Maru Gothic", sans-serif;
    font-weight:900;
    font-size:1.6rem;
    color:var(--accent-deep);
    margin:0 0 12px 0;
    line-height:1.4;
  }
  .desc{
    font-size:.95rem;
    line-height:1.9;
    color:var(--text);
    margin:0 0 22px 0;
    white-space:pre-line;
  }
  .meta-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
  }
  .meta-tags span{
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    background:rgba(91,140,86,0.1);
    color:var(--accent-deep);
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--accent-soft);
  }
  .actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    font-size:.9rem;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn:focus-visible{ outline:2px solid var(--accent-deep); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(91,140,86,.35); }
  .btn-secondary{
    background:transparent;
    color:var(--accent-deep);
    border-color:var(--line);
  }
  .btn-secondary:hover{ background:rgba(91,140,86,0.08); }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .btn:hover, .soft-item button:hover{transform:none;}
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 760px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%;
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:24px 20px;
    }
    .main{padding:28px 20px;}
  }
</style>
<meta name="google-site-verification" content="OzULXzwhCWJlPun34dPf_hKiyEF97cI37XVQGoW3TTA" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <p class="sidebar-header">  小学校の校務PCで使えます</p>
    <p class="sidebar-sub">インストール不要で、オフラインで使えます</p>
    <ul class="vine" id="soft-list"></ul>
  </aside>

  <main class="main">
    <article class="card" id="card"></article>
  </main>
</div>

<script>
// ==========================================================

// download: GitHub Releases 等のダウンロードURL
// repo: GitHubリポジトリのURL
// ==========================================================
const softwareList = [
  {
    id: "task_cho",
    icon: " ",
    name: "タスク管理ソフト",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/task_cho.png",
    description: "Windows標準の付箋ソフトが職員室で人気だったので、改良版を作成。\nドラッグアンドドロップでタスクを移動したり、繰り返しの設定ができます。\nとても便利。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/task_cho/task-cho.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
  {
    id: "timetable_gene",
    icon: " ",
    name: "固定時間割ジェネレーター",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/timetable_gene.png",
    description: "担当になると年度初めの貴重な時間を吸い取られる固定時間割の案を、３秒くらいで考えてくれます。\nウリは、時間講師（〇曜日の午前中だけ、〇年〇組の授業を〇回担当する）も設定できることです。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/timetable_gene/timetable_gene.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
  {
    id: "club_assign",
    icon: " ",
    name: "クラブ希望調査調整ツール",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/club_assign.png",
    description: "担当になってしまうと年度末すっごい大変なクラブの希望調査の調整が、３秒くらいで終わります。\nFormsなどで希望調査を取ると、更に楽です。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/club_assign/club-assign.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
  {
    id: "QRcode-maker",
    icon: " ",
    name: "オフラインQRコード作成",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/QRcodemaker.png",
    description: "校務PCに送られてきてしまったURLをQRコードにできます。\nネットが使える端末のカメラで読み取れるようになります。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB%E4%B8%8D%E8%A6%81/QRcodemaker.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
 {
    id: "hyoki_kensaku",
    icon: " ",
    name: "表記便覧　検索ソフト",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/hyoki_kensaku.png",
    description: "表記便覧をパラパラめくらなくてよくなります。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/%E8%A1%A8%E8%A8%98%E4%BE%BF%E8%A6%A7/kyoki_kensaku.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
 {
    id: "hyoki_syusei",
    icon: " ",
    name: "表記便覧に合わせてExcelやWordを自動で修正",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/hyoki_syusei.png",
    description: "よく考えたら所見はみなさんExcelで書いていたことに気付いたので、自動で修正できるものを作成しました。\nこのファイル上でのみ動作するので、情報は外部に漏れません。\n組織で簡単に表記を統一できます。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/1/hyoki_syusei.html",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
 {
    id: "pic_compress",
    icon: " ",
    name: "画像圧縮ソフト",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/pic_compress.png",
    description: "「共有フォルダがもういっぱいで、真っ赤！」ってときに使ってください。\n１BM以上の画像ファイルを５００ＫＢ程度まで圧縮します。\n圧縮し過ぎを防ぐために、１ＭＢ以下のファイルは処理をスキップします。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/pic_compress/pic_compress.exe",
    repo: "https://github.com/a071013n-sudo/my-tool"
  },
 {
    id: "mov_compress",
    icon: " ",
    name: "動画圧縮ソフト",
    tag: "",
    tags: ["インストール不要", "校務PCで使える"],
    thumbnail: "images/mov_compress.png",
    description: "行事の記録ビデオサイズ大きすぎる問題を解決できます。\n「共有フォルダがもういっぱいで、真っ赤！」ってときにも使ってください。\n動画ファイルをPC画面で見る分には支障ないサイズまで圧縮します。",
    download: "https://github.com/a071013n-sudo/my-tool/releases/download/mov_compress/mov_compress.exe",
    repo: "https://github.com/a071013n-sudo/my-tool"
  }
];

let activeId = softwareList[0].id;

function renderList(){
  const listEl = document.getElementById("soft-list");
  listEl.innerHTML = "";
  softwareList.forEach(sw => {
    const li = document.createElement("li");
    li.className = "soft-item" + (sw.id === activeId ? " active" : "");
    li.innerHTML = `
      <button type="button" data-id="${sw.id}">
        ${sw.name}
        <span class="tag">${sw.tag}</span>
      </button>
    `;
    li.querySelector("button").addEventListener("click", () => {
      activeId = sw.id;
      renderList();
      renderCard();
    });
    listEl.appendChild(li);
  });
}

function renderCard(){
  const sw = softwareList.find(s => s.id === activeId);
  const cardEl = document.getElementById("card");
  cardEl.innerHTML = `
    <div class="thumb">
      ${sw.thumbnail
        ? `<img src="${sw.thumbnail}" alt="${sw.name}のサムネイル">`
        : `<span class="fallback-icon">${sw.icon}</span>`}
    </div>
    <div class="card-body">
      <p class="eyebrow">Software</p>
      <h1 class="title">${sw.name}</h1>
      <p class="desc">${sw.description}</p>
      <div class="meta-tags">
        ${sw.tags.map(t => `<span>${t}</span>`).join("")}
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="${sw.download}" target="_blank" rel="noopener">
          ? ダウンロード
        </a>
        <a class="btn btn-secondary" href="${sw.repo}" target="_blank" rel="noopener">
          GitHubで見る
        </a>
      </div>
    </div>
  `;
}

renderList();
renderCard();
</script>

</body>
</html>
