name: 運動会・表現運動の資料を生成

on:
  push:
    branches: [main]
    paths:
      - 'content/undokai/**.json'
      - '.github/scripts/build_undokai.py'
      - '.github/workflows/undokai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 資料を生成する
        run: python .github/scripts/build_undokai.py content/undokai undokai-hyogen

      - name: 変更があればコミットする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add undokai-hyogen/
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
          else
            git commit -m "運動会の資料を更新 [skip ci]"
            git push
          fi
